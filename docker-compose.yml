services:
  community-db:
    image: postgres:16-alpine
    container_name: global-village-community-db
    environment:
      POSTGRES_DB: global_village
      POSTGRES_USER: global_village
      POSTGRES_PASSWORD: global_village
    ports:
      - "5433:5432"
    volumes:
      - community-db-data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U global_village -d global_village"]
      interval: 5s
      timeout: 5s
      retries: 10

  community-api:
    build: ./server
    container_name: global-village-community-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://global_village:global_village@community-db:5432/global_village
      AUTH_API_ME_URL: http://host.docker.internal:3002/auth/me
    ports:
      - "3000:3000"
    depends_on:
      community-db:
        condition: service_healthy

volumes:
  community-db-data:
