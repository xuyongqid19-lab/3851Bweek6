name: global_village_app
description: Global Village authentication UI built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  web: ^1.1.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
